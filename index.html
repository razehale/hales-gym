<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<link rel="manifest" href="/manifest.webmanifest">
<title>HALE'S GYM</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="top"><div class="brand">HALE'S <b>GYM</b></div><div class="small muted">THE FACTORY • CLOCK IN • GET WORK</div></div>
<div id="app">
<div class="wrap">
  <div class="tabs" id="tabs">
    <button data-tab="today" class="active">Floor</button><button data-tab="cal">Calibration</button><button data-tab="quick">Quick Hit</button><button data-tab="hiit">HIIT</button><button data-tab="custom">Custom</button><button data-tab="library">Library</button><button data-tab="history">History</button>
  </div>

  <section id="today" class="tab"></section>
  <section id="cal" class="tab hide"></section>
  <section id="quick" class="tab hide"></section>
  <section id="hiit" class="tab hide"></section>
  <section id="custom" class="tab hide"></section>
  <section id="library" class="tab hide"></section>
  <section id="history" class="tab hide"></section>
</div>
<div class="bottom"><button id="syncBtn">Save</button><button class="primary" id="startRecommended">Clock In</button></div>
</div>

<div id="infoModal" class="modal hide"><div class="sheet"><button class="ghost" id="closeInfo" style="float:right">✕</button><div id="infoBody"></div></div></div>
<div id="runnerModal" class="modal hide"><div class="sheet">
  <div class="small muted" id="runnerMeta"></div><div class="step" id="runnerStep"></div><div class="timer" id="runnerTimer">00:00</div><div class="bar"><div id="runnerBar"></div></div>
  <p class="muted" id="runnerCue"></p>
  <div id="logFields" class="grid hide"><div><label>Load / level</label><input id="runLoad" placeholder="e.g. 95 lb / BW"></div><div><label>Reps completed</label><input id="runReps" inputmode="numeric" placeholder="8"></div></div>
  <div class="runnerActions" style="margin-top:12px"><button id="runnerBack">Back</button><button class="primary" id="runnerDone">Set Done</button><button id="runnerSkip">Skip</button></div>
  <button id="runnerExit" class="ghost" style="width:100%;margin-top:8px">Exit workout</button>
</div></div>

<script src="/data.js"></script><script src="/app-core.js"></script><script src="/app-render.js"></script><script src="/app-runner.js"></script>
</body></html>
